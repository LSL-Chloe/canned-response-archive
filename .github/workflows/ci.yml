name: Verify project
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # A frozen lockfile will be committed after the first npm install.
      - run: npm install --no-audit --no-fund
      - run: npm run check

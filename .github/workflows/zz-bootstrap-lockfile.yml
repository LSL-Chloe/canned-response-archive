# Temporary branch-scoped bootstrap. Delete before merging this branch.
name: Bootstrap deterministic npm lockfile
on:
  push:
    branches: [chore/release-readiness-lockfile-2026-11]
    paths:
      - .github/workflows/zz-bootstrap-lockfile.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Resolve and verify a real npm lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit
          npm ci --no-fund --no-audit
          npm run check
      - name: Commit the verified lockfile to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: commit verified npm dependency lockfile"
          git push origin HEAD:chore/release-readiness-lockfile-2026-11
